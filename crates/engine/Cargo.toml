[package]
name = "reson-engine"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/olivecarney/reson"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "flac", "wav", "mp3"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "mp3", "pcm"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.40.2", default-features = false }
[dev-dependencies]
tempfile = "3"
