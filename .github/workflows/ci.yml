name: Build, test and release
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: "Sync Homebrew from an existing release without building"
        type: boolean
        default: false
      version:
        description: "Published version for Homebrew-only sync (e.g. 0.5.4)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.homebrew_only
    name: macOS build and test
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustup target add aarch64-apple-darwin
      - name: Cache Rust dependencies and compiled targets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-
      - name: Cache packaging dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ runner.arch }}-packaging-${{ hashFiles('scripts/requirements-packaging.txt') }}
      - name: Check and build
        run: ./scripts/check.sh
      - name: Read app version
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/reson.app/Contents/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Package and verify DMG
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reson-${{ steps.version.outputs.value }}-macos-arm64
          path: build/dist/reson-${{ steps.version.outputs.value }}-macos-arm64.dmg*
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish verified download
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reson-${{ needs.build.outputs.version }}-macos-arm64
          path: build/dist
      - name: Publish new version from this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESON_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/publish-release.sh "$RESON_VERSION" "$GITHUB_SHA"
  homebrew:
    name: Sync verified Homebrew cask
    needs: [build, publish]
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.publish.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.homebrew_only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Homebrew tap with its dedicated deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: olivecarney/homebrew-tap
          ref: main
          path: build/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
      - name: Verify published download and sync mirrored cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESON_VERSION: ${{ needs.build.outputs.version || inputs.version }}
        run: >-
          python3 scripts/update-homebrew.py --repository "$GH_REPO"
          --version "$RESON_VERSION" --tap build/homebrew-tap/Casks/reson.rb
          --publish-mirror
      - name: Commit tap update only when the cask changed
        working-directory: build/homebrew-tap
        env:
          RESON_VERSION: ${{ needs.build.outputs.version || inputs.version }}
        run: |
          if git diff --quiet -- Casks/reson.rb; then
            echo "Homebrew tap is already current; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/reson.rb
          git commit -m "Update reson cask to verified $RESON_VERSION release"
          git push origin HEAD:main
